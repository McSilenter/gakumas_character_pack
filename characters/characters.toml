# 学マス角色扩展包的角色配置。字段的含义见 eidolon-sc 的 characters/characters.toml 开头的说明；
# 这里只写和 283 不同的地方：
#   - voice_id 是 Fish Audio 上公开的学マス音色，用你自己的 FISH_AUDIO_API_KEY 就能用；不想用某位的，清空成 "" 即可（她就不说话，文字聊天不受影响）。
#   - idol_id、default_outfit、scsp_avatar 是闪耀色彩独有的，不写：通话层只显示背景，不显示立绘。
#   - background、signature 还没有素材，不写。
#   - liked_gifts 和酒吧五列的依据写在各自 facts/<id>.sources.md 的「喜欢的礼物」「酒吧口味」两节；
#     印象色、年龄、生日取自游戏数据，见同一文件的「印象色核实」。


