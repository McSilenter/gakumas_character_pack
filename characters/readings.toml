# 读音（GLOSSARY.md「读音」）：角色名、职员名、学园名在角色的声音里怎么念。每次请求 Fish Audio
# 都把 phonemes 不为空的全部条目放进请求的 pronunciation_dictionary。
#
# written：原文写法。Fish Audio 按字面子串、区分大小写匹配，所以别收会和普通词撞上的写法：
#   「広」会撞上「広い」，「燕」本身就是普通词，这两个不收（Fish 自己能念对）。
# kana：读音，姓和名之间空一格。phonemes：发给 Fish Audio 的音素串。
#
# 改读音：改 kana，把 phonemes 清空成 ""，在 eidolon-sc 的 backend 目录下运行
#   uv run eidolon reading draft --characters <本目录的 characters.toml>
# 补上音素（要用开发依赖里的 pyopenjtalk，后端镜像里没有）。已有音素的条目不动。
# 这个命令会重写整个文件，开头这段注释会换成 eidolon-sc 的，需要时从 git 恢复。

